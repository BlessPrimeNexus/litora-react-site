
name: Extract Litora React Site

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP file
        run: |
          if [ ! -f "litora-react-site.zip" ]; then
            echo "ERROR: ZIP file not found!"
            exit 1
          fi

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -o litora-react-site.zip -d extracted

      - name: Copy extracted files
        run: |
          cp -a extracted/. .
          rm -rf extracted

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Extract Litora React Site"
          git push
