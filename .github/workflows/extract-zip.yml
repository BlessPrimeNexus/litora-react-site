
name: Auto Extract Litora React Site

on:
  workflow_dispatch:
  push:
    paths:
      - 'litora-react-site.zip'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify ZIP
        run: |
          test -f litora-react-site.zip
          unzip -t litora-react-site.zip

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -o litora-react-site.zip -d extracted

      - name: Update repository files
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'litora-react-site.zip' \
            -exec rm -rf {} +

          cp -a extracted/. .
          rm -rf extracted

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git commit -m "Auto update Litora React Site" || exit 0

          git push
